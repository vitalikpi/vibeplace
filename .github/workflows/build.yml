# Builds the installers on GitHub's runners: the Windows .exe (NSIS, x64) and the
# macOS .dmg (arm64). Each is built on its own OS, since node-pty and better-sqlite3
# are native modules. The runners already have Node's native build tools (Visual
# Studio C++ / Xcode, Python).
#
# Run it from the Actions tab (Run workflow), or push a tag like v1.0.1: a tag also
# attaches both installers to a draft GitHub Release for that tag.
name: Build installers

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
            files: release/*.exe
          - os: macos-latest
            script: dist:mac
            files: release/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Reported, but doesn't block the build.
      - run: npm test
        continue-on-error: true
      # --publish never: electron-builder would otherwise try to publish on a tag.
      - run: npm run ${{ matrix.script }} -- --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: installers/*
